[platformio]
src_dir = .
default_envs = esp32s3dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
extra_scripts = pre:scripts/generate_version.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

upload_speed = 921600

lib_deps =
  Wire

build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -Iexamples
  -DCORE_DEBUG_LEVEL=0

debug_tool = esp-prog
debug_init_break = tbreak setup

; -------------------------
; ESP32-S3 dev config
; -------------------------
[env:esp32s3dev]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSHT3X_BUILD_TARGET=\"esp32s3dev\"
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>

; -------------------------
; ESP32-S2 dev config
; -------------------------
[env:esp32s2dev]
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_upload.after_reset = no-reset-stub
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSHT3X_BUILD_TARGET=\"esp32s2dev\"
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>

; -------------------------
; Native host tests
; -------------------------
[env:native]
platform = native
framework = 
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<src/**>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Wpedantic
  -Werror
  -Iinclude
  -Iexamples
  -Itest/stubs
