version: "1.9.0"
description: "Deterministic, framework-neutral C++17 SHT3x temperature/humidity sensor driver."
url: "https://github.com/janhavelka/SHT3x-main"
repository: "https://github.com/janhavelka/SHT3x-main.git"
license: "MIT"
dependencies:
  idf: ">=5.4"
files:
  exclude:
    - "test/**"
    - "tools/**"
    - "scripts/**"
    - "docs/reference/vendor/**"
    - "hil_logs/**"
    - ".pio/**"
    - ".github/**"
    - "examples/idf/basic/build/**"
    - "examples/idf/basic/sdkconfig"
    - "examples/idf/basic/sdkconfig.old"
    - "examples/idf/basic/dependencies.lock"
    - "examples/idf/basic/managed_components/**"
    - "examples/idf/basic/compile_commands.json"
